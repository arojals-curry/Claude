<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Market Basket Analysis - Apriori</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface2: #334155;
      --border: #475569;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #22c55e;
      --error: #ef4444;
      --warning: #f59e0b;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.75rem;
      margin-bottom: 1.5rem;
    }

    .card h2 {
      font-size: 1.1rem;
      margin-bottom: 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .card h2 .badge {
      background: var(--primary);
      color: #fff;
      font-size: 0.7rem;
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      font-weight: 600;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    @media (max-width: 640px) {
      .form-grid { grid-template-columns: 1fr; }
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .form-group.full-width {
      grid-column: 1 / -1;
    }

    label {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input[type="text"],
    input[type="number"],
    select {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.6rem 0.75rem;
      color: var(--text);
      font-size: 0.9rem;
      transition: border-color 0.2s;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--primary);
    }

    .file-upload {
      border: 2px dashed var(--border);
      border-radius: 10px;
      padding: 2rem;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      position: relative;
    }

    .file-upload:hover, .file-upload.dragover {
      border-color: var(--primary);
      background: rgba(59, 130, 246, 0.05);
    }

    .file-upload input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    .file-upload .icon {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }

    .file-upload .file-name {
      color: var(--success);
      font-weight: 600;
      margin-top: 0.5rem;
    }

    .btn {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0.75rem 2rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn:hover { background: var(--primary-hover); }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-success {
      background: var(--success);
    }

    .btn-success:hover {
      background: #16a34a;
    }

    .actions {
      display: flex;
      gap: 1rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 3px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .log-box {
      background: #0d1117;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      font-family: 'Cascadia Code', 'Fira Code', monospace;
      font-size: 0.8rem;
      color: var(--success);
      max-height: 300px;
      overflow-y: auto;
      white-space: pre-wrap;
      line-height: 1.5;
    }

    .results-table-wrapper {
      overflow-x: auto;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }

    th {
      background: var(--surface2);
      padding: 0.65rem 0.75rem;
      text-align: left;
      font-weight: 600;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      white-space: nowrap;
    }

    td {
      padding: 0.55rem 0.75rem;
      border-top: 1px solid var(--border);
    }

    tr:hover td {
      background: rgba(59, 130, 246, 0.05);
    }

    .alert {
      padding: 1rem;
      border-radius: 8px;
      font-size: 0.9rem;
    }

    .alert-error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid var(--error);
      color: var(--error);
    }

    .alert-success {
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid var(--success);
      color: var(--success);
    }

    .hidden { display: none !important; }

    .stat-row {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }

    .stat {
      background: var(--surface2);
      border-radius: 8px;
      padding: 0.75rem 1.25rem;
      flex: 1;
      min-width: 120px;
      text-align: center;
    }

    .stat .value {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--primary);
    }

    .stat .label {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-top: 0.15rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Market Basket Analysis</h1>
      <p>Algoritmo Apriori &mdash; Sube tu CSV y configura los par&aacute;metros</p>
    </header>

    <!-- File Upload -->
    <div class="card">
      <h2>Archivo CSV <span class="badge">Paso 1</span></h2>
      <div class="file-upload" id="dropZone">
        <div class="icon">&#128194;</div>
        <div>Arrastra tu archivo CSV aqu&iacute; o haz clic para seleccionar</div>
        <div class="file-name hidden" id="fileName"></div>
        <input type="file" id="csvFile" accept=".csv" />
      </div>
    </div>

    <!-- Parameters -->
    <div class="card">
      <h2>Configuraci&oacute;n <span class="badge">Paso 2</span></h2>
      <div class="form-grid">
        <div class="form-group">
          <label for="columna_items">Columna de items</label>
          <input type="text" id="columna_items" value="tipo_prenda_concat"
                 placeholder="ej: tipo_prenda_concat" />
        </div>
        <div class="form-group">
          <label for="tipo_transaccion_filtro">Tipo de transacci&oacute;n</label>
          <input type="text" id="tipo_transaccion_filtro" value="Solo Bebe"
                 placeholder="ej: Solo Bebe" />
        </div>
        <div class="form-group">
          <label for="min_support">Soporte m&iacute;nimo</label>
          <input type="number" id="min_support" value="0.001" step="0.001" min="0.0001" max="1" />
        </div>
        <div class="form-group">
          <label for="min_confidence">Confianza m&iacute;nima</label>
          <input type="number" id="min_confidence" value="0.4" step="0.05" min="0" max="1" />
        </div>
        <div class="form-group">
          <label for="min_lift">Lift m&iacute;nimo</label>
          <input type="number" id="min_lift" value="1.0" step="0.1" min="0" />
        </div>
      </div>
    </div>

    <!-- Run -->
    <div class="card">
      <h2>Ejecutar An&aacute;lisis <span class="badge">Paso 3</span></h2>
      <div class="actions">
        <button class="btn" id="runBtn" onclick="runAnalysis()">
          Ejecutar An&aacute;lisis
        </button>
        <button class="btn btn-success hidden" id="downloadBtn" onclick="downloadExcel()">
          Descargar Excel
        </button>
      </div>
    </div>

    <!-- Error -->
    <div class="card hidden" id="errorCard">
      <div class="alert alert-error" id="errorMsg"></div>
    </div>

    <!-- Logs -->
    <div class="card hidden" id="logCard">
      <h2>Registro del proceso</h2>
      <div class="log-box" id="logBox"></div>
    </div>

    <!-- Results -->
    <div class="card hidden" id="resultsCard">
      <h2>Resultados</h2>
      <div class="stat-row" id="statsRow"></div>
      <div class="results-table-wrapper">
        <table id="resultsTable">
          <thead id="tableHead"></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
      <p style="margin-top:0.75rem; color:var(--text-muted); font-size:0.8rem;" id="previewNote"></p>
    </div>
  </div>

  <script>
    let excelBase64 = null;

    // Drag and drop
    const dropZone = document.getElementById('dropZone');
    const csvInput = document.getElementById('csvFile');
    const fileNameEl = document.getElementById('fileName');

    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('dragover');
    });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      if (e.dataTransfer.files.length) {
        csvInput.files = e.dataTransfer.files;
        showFileName(e.dataTransfer.files[0].name);
      }
    });
    csvInput.addEventListener('change', () => {
      if (csvInput.files.length) showFileName(csvInput.files[0].name);
    });

    function showFileName(name) {
      fileNameEl.textContent = name;
      fileNameEl.classList.remove('hidden');
    }

    async function runAnalysis() {
      const file = csvInput.files[0];
      if (!file) {
        showError('Por favor selecciona un archivo CSV.');
        return;
      }

      // Vercel Hobby plan: max 4.5MB body
      if (file.size > 4.5 * 1024 * 1024) {
        showError('El archivo pesa ' + (file.size / (1024*1024)).toFixed(1) + 'MB. El limite de Vercel es 4.5MB. Reduce el CSV (elimina columnas innecesarias o filtra filas).');
        return;
      }

      const btn = document.getElementById('runBtn');
      btn.disabled = true;
      btn.innerHTML = '<div class="spinner"></div> Procesando...';

      hideAll();
      document.getElementById('logCard').classList.remove('hidden');
      document.getElementById('logBox').textContent = 'Enviando datos al servidor...\n';

      const formData = new FormData();
      formData.append('csv_file', file);
      formData.append('columna_items', document.getElementById('columna_items').value);
      formData.append('tipo_transaccion_filtro', document.getElementById('tipo_transaccion_filtro').value);
      formData.append('min_support', document.getElementById('min_support').value);
      formData.append('min_confidence', document.getElementById('min_confidence').value);
      formData.append('min_lift', document.getElementById('min_lift').value);

      try {
        const resp = await fetch('/api/analyze', { method: 'POST', body: formData });

        // Handle non-JSON responses (e.g. Vercel 413 "Request Entity Too Large")
        const contentType = resp.headers.get('content-type') || '';
        if (!contentType.includes('application/json')) {
          const text = await resp.text();
          if (resp.status === 413 || text.includes('Entity Too Large')) {
            showError('El archivo es demasiado grande. Vercel permite max 4.5MB. Reduce el CSV antes de subirlo.');
          } else {
            showError('Error del servidor (' + resp.status + '): ' + text.substring(0, 200));
          }
          btn.disabled = false;
          btn.innerHTML = 'Ejecutar An&aacute;lisis';
          return;
        }

        const data = await resp.json();

        if (data.logs && data.logs.length) {
          document.getElementById('logBox').textContent = data.logs.join('\n');
        }

        if (!data.success) {
          showError(data.error || 'Error desconocido');
          btn.disabled = false;
          btn.innerHTML = 'Ejecutar An&aacute;lisis';
          return;
        }

        // Show stats
        const statsRow = document.getElementById('statsRow');
        statsRow.innerHTML = `
          <div class="stat"><div class="value">${data.total_rules}</div><div class="label">Reglas encontradas</div></div>
        `;

        // Show table
        if (data.preview && data.preview.length) {
          const cols = data.columns || Object.keys(data.preview[0]);
          const thead = document.getElementById('tableHead');
          thead.innerHTML = '<tr>' + cols.map(c => `<th>${c}</th>`).join('') + '</tr>';

          const tbody = document.getElementById('tableBody');
          tbody.innerHTML = data.preview.map(row =>
            '<tr>' + cols.map(c => {
              const v = row[c];
              return `<td>${typeof v === 'number' ? v.toFixed(4) : v}</td>`;
            }).join('') + '</tr>'
          ).join('');

          const note = document.getElementById('previewNote');
          if (data.total_rules > 50) {
            note.textContent = `Mostrando 50 de ${data.total_rules} reglas. Descarga el Excel para ver todas.`;
          } else {
            note.textContent = '';
          }
        }

        // Store excel
        excelBase64 = data.excel_base64;

        document.getElementById('resultsCard').classList.remove('hidden');
        document.getElementById('downloadBtn').classList.remove('hidden');

      } catch (err) {
        showError('Error de conexi\u00f3n: ' + err.message);
      }

      btn.disabled = false;
      btn.innerHTML = 'Ejecutar An&aacute;lisis';
    }

    function downloadExcel() {
      if (!excelBase64) return;
      const blob = b64toBlob(excelBase64, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'association_rules.xlsx';
      a.click();
      URL.revokeObjectURL(url);
    }

    function b64toBlob(b64, type) {
      const bin = atob(b64);
      const arr = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      return new Blob([arr], { type });
    }

    function showError(msg) {
      const card = document.getElementById('errorCard');
      card.classList.remove('hidden');
      document.getElementById('errorMsg').textContent = msg;
    }

    function hideAll() {
      document.getElementById('errorCard').classList.add('hidden');
      document.getElementById('resultsCard').classList.add('hidden');
      document.getElementById('downloadBtn').classList.add('hidden');
      excelBase64 = null;
    }
  </script>
</body>
</html>
